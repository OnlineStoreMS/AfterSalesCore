# AfterSalesCore HTTPS（需挂载 /etc/nginx/certs/server.crt 与 server.key）
server {
    listen 80;
    return 301 https://$host:__TLS_PORT__$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 512m;

    # Docker DNS: re-resolve when upstream containers get new IPs
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://aftersalescore-api:8093;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /iam/ {
        set $iam_upstream http://usercore-api:8091;
        rewrite ^/iam/(.*)$ /api/v1/$1 break;
        proxy_pass $iam_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
