<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>OSMS 抖店售后</title>
    <style>
      body {
        margin: 0;
        min-width: 340px;
        font: 13px/1.45 system-ui, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      main { padding: 12px 14px 16px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .ok { color: #15803d; }
      .warn { color: #b45309; }
      .bad { color: #b91c1c; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
      input, button {
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        padding: 6px 10px;
        font: inherit;
      }
      input { flex: 1; min-width: 0; }
      button {
        border: 0;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        white-space: nowrap;
      }
      button.secondary { background: #64748b; }
      button.danger { background: #dc2626; }
      .hint { color: #64748b; font-size: 12px; margin-top: 8px; }
      .block { margin-top: 12px; padding-top: 10px; border-top: 1px solid #e2e8f0; }
      label { display: block; font-size: 12px; color: #475569; margin-bottom: 4px; }
      .meta { color: #475569; font-size: 12px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <main>
      <h1>OSMS 抖店售后工作台</h1>
      <div id="status" class="warn">读取中…</div>
      <div id="shop" class="meta"></div>
      <div id="sync" class="meta"></div>

      <div class="block">
        <label for="apiBase">售后管理地址</label>
        <div class="row">
          <input id="apiBase" placeholder="https://osms.zfcycle.com/apps/aftersales" />
          <button type="button" class="secondary" id="saveApiBtn">保存</button>
        </div>
      </div>

      <div id="bindBlock" class="block">
        <label for="bindCode">绑定码</label>
        <div class="row">
          <input id="bindCode" placeholder="在售后管理店铺详情复制" maxlength="16" />
          <button type="button" id="bindBtn">绑定</button>
        </div>
        <div class="hint">在售后管理添加抖店店铺后，把绑定码填到这里。一个插件对应一个店铺。</div>
      </div>

      <div id="boundBlock" class="block" hidden>
        <div class="row">
          <button type="button" id="syncBtn">立即同步</button>
          <button type="button" class="secondary" id="openBtn">打开抖店工作台</button>
          <button type="button" class="danger" id="unbindBtn">解除绑定</button>
        </div>
        <div class="hint">只要开着任意抖店后台标签即可。每次同步都会先点左侧「售后工作台」，再采售后单，再点「服务工单」，采完再点回工作台。</div>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
